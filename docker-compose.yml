version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: microservice-postgres
    environment:
      POSTGRES_DB: microserviceDemo
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  eureka-server:
    build: ./eureka-service
    container_name: eureka-server
    ports:
      - "8761:8761"

  address-service:
    build: ./address-service
    container_name: address-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/microserviceDemo
    depends_on:
      - postgres
      - eureka-server

  student-service:
    build: ./student-service
    container_name: student-service
    ports:
      - "8081:8081"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/microserviceDemo
    depends_on:
      - postgres
      - eureka-server
      - address-service

volumes:
  postgres-data: